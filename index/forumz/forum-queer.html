<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>forums &gt; queer</title>
<style>
  * { box-sizing: border-box; }
  body {
    background: #f4f4f4;
    color: #000;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 13px;
    margin: 0;
    padding: 0;
    text-decoration: none;
  }
  a { color: #0000E4; cursor: pointer; }
  a:visited { color: #4e3086; }
  a:hover { color: #cc0000; }

  #topbar {
    border-bottom: 1px solid #999;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  #topbar .logo {
    width: 34px; height: 34px;
    border: 1px solid #999;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: bold;
    font-size: 12px;
    color: #333;
  }
  #topbar .crumbs { font-size: 14px; }
  #topbar input[type=text] {
    border: 1px solid #999;
    padding: 3px 4px;
    font-size: 12px;
    width: 160px;
  }
  #topbar button {
    font-size: 12px;
    padding: 3px 8px;
    border: 1px solid #999;
    background: #f0f0f0;
    cursor: pointer;
  }
  #topbar .right {
    margin-left: auto;
    font-size: 12px;
    display: flex;
    gap: 14px;
  }

  #toolbar {
    display: flex;
    justify-content: space-between;
    padding: 10px 14px;
    border-bottom: 1px solid #ddd;
    font-size: 12px;
  }

  #main {
    display: flex;
  }
  #threadlist {
    flex: 1;
    padding: 10px 14px;
    border-right: 1px solid #ddd;
  }

  #sidebar {
    width: 570px;
    padding: 20px;
    font-family: "Arial", monospace;
    font-size: 20px;
    font-weight: bold;
    color: #333;
    line-height: 1.7;
    white-space: normal;
  }

  #sidebar .quote-attr {
    text-align: right;
    display: block;
    margin-top: 8px;
  }

  #sidebar .post-title {
    font-family: Helvetica, Arial, sans-serif;
    font-weight: bold;
    font-size: 13px;
    color: #000;
    margin-bottom: 12px;
  }
  #sidebar .post-title .post-author {
    color: #2a7a2a;
    font-weight: bold;
  }
  #sidebar .post-title .post-time {
    color: #000;
    font-weight: normal;
    font-size: 13px;
  }
  #sidebar .post-body {
    font-family: "Arial", monospace;
    font-weight: normal;
  }
  #sidebar .post-empty {
    color: #aaa;
    font-style: italic;
  }
  #sidebar .back-link {
    display: inline-block;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 11px;
    margin-bottom: 14px;
  }

  .thread-group { margin-bottom: 18px; }
  .thread-date {
    color: #666;
    font-size: 12px;
    margin: 4px 0 4px 20px;
  }
  .row {
    white-space: pre;
    font-family: Helvetica, Arial, sans-serif;
    line-height: 1.55;
  }
  .row .indent { color: #000; letter-spacing: 1px; }
  .row a.title { font-weight: bold; text-decoration: none; }
  .row a.title.reply { font-weight: bold; }
  .row .author { color: #43972a; font-weight: bold; }
  .row .time { color: #888; font-size: 11px; }
  .row .score { font-size: 11px; font-weight: bold; margin-left: 4px; }
  .row .score.neg { color: #cc2222; }
  .row .score.pos { color: #2a7a2a; }
  .row .votebtn {
    font-size: 10px;
    color: #aaa;
    text-decoration: none;
    margin: 0 1px;
    border: 1px solid #ddd;
    padding: 0 3px;
    cursor: pointer;
  }
  .row .votebtn:hover { color: #333; background: #f0f0f0; }

  #composer {
    display: none;
    margin: 14px;
    padding: 12px;
    border: 1px solid #ccc;
    background: #fafafa;
  }
  #composer.open { display: block; }
  #composer input[type=text], #composer textarea {
    width: 100%;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 12px;
    padding: 5px;
    border: 1px solid #999;
    margin-bottom: 8px;
  }
  #composer textarea { height: 60px; resize: vertical; }
  #composer .composer-actions { display: flex; gap: 8px; }
  #composer button {
    font-size: 12px;
    padding: 4px 10px;
    border: 1px solid #999;
    background: #f0f0f0;
    cursor: pointer;
  }
  #composer .cancel { background: #fff; }

  footer {
    padding: 14px;
    font-size: 11px;
    color: #999;
    border-top: 1px solid #ddd;
    margin-top: 10px;
  }
</style>
</head>
<body>

<div id="topbar">
  <div class="logo">RE</div>
  <div class="crumbs">
    <a href="/index/forumz.html">forums</a> &gt; <b>queer</b>
  </div>
  <input type="text" placeholder="search this forum" id="searchbox">
  <button onclick="doSearch()">search</button>
  <div class="right">
    <a href="#" onclick="openComposer(); return false;">compose new thread</a>
  </div>
</div>

<div id="toolbar">
  <span id="statusline">threads</span>
  <span>
    <a href="#" id="newerLink" onclick="return goNewer();">&lt; newer</a>
    <a href="#" id="olderLink" onclick="return goOlder();">older &gt;</a>
  </span>
</div>

<div id="composer">
  <input type="text" id="newName" placeholder="name (optional)" maxlength="40">
  <input type="text" id="newTitle" placeholder="subject">
  <textarea id="newBody" placeholder="write something..."></textarea>
  <div class="composer-actions">
    <button onclick="postThread()">post</button>
    <button class="cancel" onclick="closeComposer()">cancel</button>
  </div>
</div>

<div id="main">
  <div id="threadlist"></div>
  <div id="sidebar">
    <div id="sidebarDefault">I was guilty and irritated and full of love and pain. I wanted to kick him and I wanted to take him in my arms.<span class="quote-attr">-- James Baldwin, <em>Giovanni&#x2019;s Room</em></span></div>
    <div id="sidebarPost" style="display:none;"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://gcledfplbxjjaoomnbom.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdjbGVkZnBsYnhqamFvb21uYm9tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1NDE3MDIsImV4cCI6MjEwMTExNzcwMn0.Os7vq8RA5D8mkLBeit7w6hgDpJoXUC94qeKSFTi_7DI';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const FORUM_CATEGORY = 'life stuff';

let seedThreads = [];

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function formatTimestamp(date = new Date()) {
  const pad = n => String(n).padStart(2, '0');
  return `${date.getFullYear()}.${pad(date.getMonth()+1)}.${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}`;
}

function buildTree(rows) {
  const byId = {};
  rows.forEach(r => {
    byId[r.id] = {
      _id: r.id,
      title: r.title,
      author: r.author,
      body: r.body || '',
      time: formatTimestamp(new Date(r.created_at)),
      score: r.score,
      replies: []
    };
  });
  const roots = [];
  rows.forEach(r => {
    const node = byId[r.id];
    if (r.parent_id && byId[r.parent_id]) {
      byId[r.parent_id].replies.push(node);
    } else {
      roots.push(node);
    }
  });
  return roots;
}

const PAGE_SIZE = 20;
let currentPage = 0;
let totalRootCount = 0;

async function fetchDescendants(rootIds) {
  const all = [];
  let frontier = rootIds;
  while (frontier.length > 0) {
    const { data: rows, error } = await sb
      .from('forum_posts')
      .select('id, parent_id, title, author, body, score, created_at')
      .in('parent_id', frontier);

    if (error) {
      console.error('Failed to load replies:', error);
      break;
    }
    if (!rows.length) break;
    all.push(...rows);
    frontier = rows.map(r => r.id);
  }
  return all;
}

async function loadThreads() {
  const from = currentPage * PAGE_SIZE;
  const to = from + PAGE_SIZE - 1;

  const { data: roots, error, count } = await sb
    .from('forum_posts')
    .select('id, parent_id, title, author, body, score, created_at', { count: 'exact' })
    .is('parent_id', null)
    .eq('category', FORUM_CATEGORY)
    .order('created_at', { ascending: false })
    .range(from, to);

  if (error) {
    console.error('Failed to load threads:', error);
    document.getElementById('threadlist').innerHTML = '<div class="row">couldn\'t load threads — try refreshing.</div>';
    return;
  }

  totalRootCount = count ?? roots.length;

  const rootIds = roots.map(r => r.id);
  const replies = rootIds.length ? await fetchDescendants(rootIds) : [];

  const tree = buildTree([...roots, ...replies]);
  seedThreads = roots.map(r => tree.find(t => t._id === r.id)).filter(Boolean);

  render();
  updateNav();
}

function updateNav() {
  const olderLink = document.getElementById('olderLink');
  const newerLink = document.getElementById('newerLink');
  const hasOlder = (currentPage + 1) * PAGE_SIZE < totalRootCount;
  const hasNewer = currentPage > 0;

  olderLink.style.color = hasOlder ? '' : '#ccc';
  olderLink.style.pointerEvents = hasOlder ? '' : 'none';
  newerLink.style.color = hasNewer ? '' : '#ccc';
  newerLink.style.pointerEvents = hasNewer ? '' : 'none';
}

function goOlder() {
  if ((currentPage + 1) * PAGE_SIZE < totalRootCount) {
    currentPage++;
    loadThreads();
  }
  return false;
}

function goNewer() {
  if (currentPage > 0) {
    currentPage--;
    loadThreads();
  }
  return false;
}

function render() {
  const el = document.getElementById("threadlist");
  el.innerHTML = "";
  seedThreads.forEach(t => {
    const group = document.createElement("div");
    group.className = "thread-group";
    group.appendChild(renderRow(t, 0, true));
    renderChildren(t, 1, group);
    el.appendChild(group);
  });
  document.getElementById("statusline").textContent = seedThreads.length + " threads" + (totalRootCount > seedThreads.length ? " (of " + totalRootCount + ")" : "");
}

function renderChildren(node, depth, container) {
  (node.replies || []).forEach(child => {
    container.appendChild(renderRow(child, depth, false));
    renderChildren(child, depth + 1, container);
  });
}

function scoreClass(s) {
  if (s > 0) return "pos";
  if (s < 0) return "neg";
  return "";
}

function renderRow(node, depth, isRoot) {
  const row = document.createElement("div");
  row.className = "row";
  const indent = ": . . ".repeat(depth * 1) + (depth > 0 ? " " : "");
  const scoreSpan = node.score !== 0
    ? `<span class="score ${scoreClass(node.score)}">${node.score > 0 ? "+" + node.score : node.score}</span>`
    : "";
  row.innerHTML =
    `<span class="indent">${indent}</span>` +
    `<a class="title${isRoot ? "" : " reply"}" href="#" onclick="showBody('${node._id}'); return false;">${escapeHtml(node.title)}</a> ` +
    `&lt; <span class="author">${escapeHtml(node.author)}</span> &gt; ` +
    `<span class="time">${node.time}</span> ` +
    scoreSpan +
    ` <a class="votebtn" onclick="vote('${node._id}',1)">+</a><a class="votebtn" onclick="vote('${node._id}',-1)">-</a>` +
    ` <a class="votebtn" onclick="reply('${node._id}')">reply</a>`;
  return row;
}

function findNode(id, nodes) {
  for (const n of nodes) {
    if (n._id === id) return n;
    if (n.replies) {
      const found = findNode(id, n.replies);
      if (found) return found;
    }
  }
  return null;
}

function showBody(id) {
  const n = findNode(id, seedThreads);
  if (!n) return;

  const bodyHtml = n.body && n.body.trim()
    ? escapeHtml(n.body)
    : '<span class="post-empty">   </span>';

  document.getElementById('sidebarPost').innerHTML =
    `<a href="#" class="back-link" onclick="hideBody(); return false;">&lt; back</a>` +
    `<div class="post-title">${escapeHtml(n.title)} &lt; <span class="post-author">${escapeHtml(n.author)}</span> &gt; <span class="post-time">${n.time}</span></div>` +
    `<div class="post-body">${bodyHtml}</div>`;

  document.getElementById('sidebarDefault').style.display = 'none';
  document.getElementById('sidebarPost').style.display = 'block';
}

function hideBody() {
  document.getElementById('sidebarPost').style.display = 'none';
  document.getElementById('sidebarDefault').style.display = 'block';
}

async function vote(id, dir) {
  const n = findNode(id, seedThreads);
  if (n) { n.score += dir; render(); }

  const { error } = await sb.rpc('increment_score', { post_id: id, delta: dir });
  if (error) {
    console.error('Failed to save vote:', error);
    if (n) { n.score -= dir; render(); }
  }
}

let lastUsedName = "";

async function reply(id) {
  const text = prompt("reply title:");
  if (!text) return;
  const body = prompt("reply body (optional):") || "";
  const name = prompt("name (optional):", lastUsedName) || "";
  if (name.trim()) lastUsedName = name.trim();

  const { error } = await sb
    .from('forum_posts')
    .insert({ title: text, body, author: name.trim() || 'anonymous', parent_id: id, category: FORUM_CATEGORY });

  if (error) {
    console.error('Failed to post reply:', error);
    alert("couldn't post that reply — try again.");
    return;
  }
  await loadThreads();
}

function openComposer() {
  document.getElementById("composer").classList.add("open");
  document.getElementById("newName").value = lastUsedName;
}
function closeComposer() {
  document.getElementById("composer").classList.remove("open");
  document.getElementById("newName").value = "";
  document.getElementById("newTitle").value = "";
  document.getElementById("newBody").value = "";
}
async function postThread() {
  const title = document.getElementById("newTitle").value.trim();
  if (!title) return;
  const body = document.getElementById("newBody").value.trim();
  const name = document.getElementById("newName").value.trim();
  if (name) lastUsedName = name;

  const postBtn = document.querySelector('#composer button[onclick="postThread()"]');
  if (postBtn) postBtn.disabled = true;

  const { error } = await sb
    .from('forum_posts')
    .insert({ title, body, author: name || 'anonymous', parent_id: null, category: FORUM_CATEGORY });

  if (postBtn) postBtn.disabled = false;

  if (error) {
    console.error('Failed to post thread:', error);
    alert("couldn't post that thread — try again.");
    return;
  }
  closeComposer();
  currentPage = 0;
  await loadThreads();
}
function doSearch() {
  const q = document.getElementById("searchbox").value.toLowerCase();
  if (!q) { render(); return; }
  const el = document.getElementById("threadlist");
  el.innerHTML = "";
  const matches = [];
  function walk(nodes) {
    nodes.forEach(n => {
      if (n.title.toLowerCase().includes(q)) matches.push(n);
      if (n.replies) walk(n.replies);
    });
  }
  walk(seedThreads);
  document.getElementById("statusline").textContent = matches.length + " results for \"" + q + "\"";
  matches.forEach(m => el.appendChild(renderRow(m, 0, true)));
}

loadThreads();
</script>

</body>
</html>
